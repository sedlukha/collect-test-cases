# pnpm settings live here, not in the "pnpm" field of package.json: pnpm 11 no
# longer reads that field. See https://pnpm.io/settings

# Let these packages run their install scripts: both fetch a native binary.
allowBuilds:
  esbuild: true
  unrs-resolver: true

# Install native binaries for every platform we work from, not just the one
# running pnpm. This repo is installed both from macOS and from a Linux
# sandbox, and a single-platform install breaks the other side.
supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - arm64
    - x64
